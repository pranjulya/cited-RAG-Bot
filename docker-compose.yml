services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cited_rag
      POSTGRES_PASSWORD: cited_rag
      POSTGRES_DB: cited_rag
    ports:
      # Host 5433 so a local Postgres on 5432 is not used by mistake.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cited_rag -d cited_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      CITED_RAG_ENVIRONMENT: development
      CITED_RAG_DATABASE_URL: postgresql+asyncpg://cited_rag:cited_rag@postgres:5432/cited_rag
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CITED_RAG_ENVIRONMENT: development
      CITED_RAG_API_KEY: replace-me
      CITED_RAG_LOG_LEVEL: INFO
      CITED_RAG_DEBUG: "false"
      CITED_RAG_DATABASE_URL: postgresql+asyncpg://cited_rag:cited_rag@postgres:5432/cited_rag
      CITED_RAG_LOCAL_STORAGE_PATH: /data/objects
      CITED_RAG_MAX_UPLOAD_BYTES: "20971520"
      CITED_RAG_REDIS_URL: redis://redis:6379/0
      CITED_RAG_PARSER_BACKEND: pypdf
      CITED_RAG_QDRANT_URL: http://qdrant:6333
      CITED_RAG_QDRANT_COLLECTION: cited_rag
      CITED_RAG_EMBEDDING_BACKEND: hash
      CITED_RAG_EMBEDDING_DIMENSION: "32"
    volumes:
      - api-objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build: .
    command: ["arq", "cited_rag.workers.ingestion_worker.WorkerSettings"]
    environment:
      CITED_RAG_ENVIRONMENT: development
      CITED_RAG_API_KEY: replace-me
      CITED_RAG_LOG_LEVEL: INFO
      CITED_RAG_DATABASE_URL: postgresql+asyncpg://cited_rag:cited_rag@postgres:5432/cited_rag
      CITED_RAG_LOCAL_STORAGE_PATH: /data/objects
      CITED_RAG_REDIS_URL: redis://redis:6379/0
      CITED_RAG_PARSER_BACKEND: pypdf
      CITED_RAG_QDRANT_URL: http://qdrant:6333
      CITED_RAG_QDRANT_COLLECTION: cited_rag
      CITED_RAG_EMBEDDING_BACKEND: hash
      CITED_RAG_EMBEDDING_DIMENSION: "32"
    volumes:
      - api-objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, pathlib, redis; assert b'arq' in pathlib.Path('/proc/1/cmdline').read_bytes(); redis.Redis.from_url(os.environ['CITED_RAG_REDIS_URL']).ping()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  api-objects:
