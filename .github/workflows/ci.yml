name: ci

on:
  push:
  pull_request:

jobs:
  lint-type-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Unit tests
        run: pytest tests/unit
      - name: Evaluation smoke
        run: python -m cited_rag.evaluation

  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cited_rag
          POSTGRES_PASSWORD: cited_rag
          POSTGRES_DB: cited_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cited_rag -d cited_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
    env:
      CITED_RAG_ENVIRONMENT: test
      CITED_RAG_API_KEY: test-placeholder-key
      CITED_RAG_DATABASE_URL: postgresql+asyncpg://cited_rag:cited_rag@localhost:5432/cited_rag
      CITED_RAG_REDIS_URL: redis://localhost:6379/0
      CITED_RAG_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 1
          done
          exit 1
      - name: Integration tests
        run: pytest tests/integration

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start compose stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Probe API health and readiness
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/ready
          curl -sf http://localhost:8080/
      - name: Confirm API and worker are healthy
        run: |
          docker compose ps
          docker compose ps | grep -E "api-1" | grep -i healthy
          docker compose ps | grep -E "worker-1" | grep -i healthy
          docker compose ps | grep -E "web-1" | grep -i healthy
      - name: Tear down
        if: always()
        run: docker compose down -v
