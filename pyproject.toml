[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-rag"
version = "0.1.0"
description = "PDF-only cited RAG service with page-level citations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cited RAG Bot" }]
dependencies = [
    "alembic>=1.14.0",
    "arq>=0.26.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "pypdf>=5.0.0",
    "qdrant-client>=1.13.0,<1.14.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
parser = [
    "docling>=2.14.0",
]
sparse = [
    "fastembed>=0.4.0",
]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: tests that need PostgreSQL and CITED_RAG_DATABASE_URL",
    "redis: tests that need Redis and CITED_RAG_REDIS_URL",
    "docling: tests that import the optional Docling extra",
    "qdrant: tests that need Qdrant and CITED_RAG_QDRANT_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "implementation", "Learning", ".venv", "alembic/script.py.mako", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/cited_rag/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cited_rag"]

[[tool.mypy.overrides]]
module = ["docling", "docling.*", "qdrant_client", "qdrant_client.*", "fastembed", "fastembed.*"]
ignore_missing_imports = true
